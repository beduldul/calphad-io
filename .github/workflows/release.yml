# Release to PyPI via Trusted Publishing (OIDC). No API token is used anywhere.
#
# ---------------------------------------------------------------------------
# ONE-TIME OWNER SETUP (do this once, before the first tag)
# ---------------------------------------------------------------------------
# 1. Create a PyPI account if you do not have one: https://pypi.org/account/register/
# 2. Enable 2FA on the PyPI account (required to publish).
# 3. Because `calphad-io` does not exist on PyPI yet, add a PENDING publisher
#    (not an "existing project" publisher):
#       https://pypi.org/manage/account/publishing/
#    Fill in EXACTLY:
#       PyPI Project Name : calphad-io
#       Owner             : beduldul
#       Repository name   : calphad-io
#       Workflow name     : release.yml
#       Environment name  : pypi
# 4. Do NOT create an API token. The workflow authenticates with OIDC.
#
# The first upload MUST come from this workflow. After the first successful
# publish the pending publisher becomes a normal publisher on the project.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate the distribution with twine
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Upload the distribution as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing — no password/secret
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Re-validate the distribution with twine
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
